<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero Avatar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 200px; height: 300px; position: relative">
  <svg width="200" height="300" viewBox="0 0 200 300" role="img" aria-label="{{label}}">
    <defs>
      <linearGradient id="{{uid}}Skin" x1="0" y1="0" x2="1" y2="0.2"><stop offset="0" stop-color="{{skinL}}"></stop><stop offset="0.5" stop-color="{{skin}}"></stop><stop offset="1" stop-color="{{skinD}}"></stop></linearGradient>
      <linearGradient id="{{uid}}Hair" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="{{hairL}}"></stop><stop offset="0.55" stop-color="{{hair}}"></stop><stop offset="1" stop-color="{{hairD}}"></stop></linearGradient>
      <linearGradient id="{{uid}}Top" x1="0" y1="0" x2="1" y2="0.25"><stop offset="0" stop-color="{{topL}}"></stop><stop offset="0.5" stop-color="{{topC}}"></stop><stop offset="1" stop-color="{{topD}}"></stop></linearGradient>
      <linearGradient id="{{uid}}Outer" x1="0" y1="0" x2="1" y2="0.35"><stop offset="0" stop-color="{{outL}}"></stop><stop offset="0.45" stop-color="{{outC}}"></stop><stop offset="1" stop-color="{{outD}}"></stop></linearGradient>
      <linearGradient id="{{uid}}Bot" x1="0" y1="0" x2="1" y2="0.1"><stop offset="0" stop-color="{{botL}}"></stop><stop offset="0.45" stop-color="{{botC}}"></stop><stop offset="1" stop-color="{{botD}}"></stop></linearGradient>
      <linearGradient id="{{uid}}Sleeve" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="{{slvL}}"></stop><stop offset="0.45" stop-color="{{slvC}}"></stop><stop offset="1" stop-color="{{slvD}}"></stop></linearGradient>
      <linearGradient id="{{uid}}Shoe" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="{{shoeL}}"></stop><stop offset="1" stop-color="{{shoeD}}"></stop></linearGradient>
      <linearGradient id="{{uid}}Gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9A8"></stop><stop offset="0.5" stop-color="#E2B13C"></stop><stop offset="1" stop-color="#A87A1C"></stop></linearGradient>
      <pattern id="{{uid}}Twill" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0 3 L3 0" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="0.6"></path><path d="M0 0 L3 3" stroke="#000000" stroke-opacity="0.1" stroke-width="0.5"></path></pattern>
      <pattern id="{{uid}}Butta" width="8" height="9" patternUnits="userSpaceOnUse"><path d="M4 2 L5.3 4.5 L4 7 L2.7 4.5 Z" fill="url(#{{uid}}Gold)"></path></pattern>
      <pattern id="{{uid}}Seq" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.6" fill="#FFFFFF" opacity="0.9"></circle><circle cx="5.5" cy="5" r="0.55" fill="{{accent}}"></circle></pattern>
      <filter id="{{uid}}B1" filterUnits="userSpaceOnUse" x="-20" y="-40" width="240" height="360"><feGaussianBlur stdDeviation="0.7"></feGaussianBlur></filter>
      <filter id="{{uid}}B2" filterUnits="userSpaceOnUse" x="-20" y="-40" width="240" height="360"><feGaussianBlur stdDeviation="1.8"></feGaussianBlur></filter>
      <filter id="{{uid}}Rim" filterUnits="userSpaceOnUse" x="-20" y="-40" width="240" height="360">
        <feOffset in="SourceAlpha" dx="-2.4" dy="0.6" result="off"></feOffset>
        <feComposite in="SourceAlpha" in2="off" operator="out" result="edge"></feComposite>
        <feGaussianBlur in="edge" stdDeviation="0.6" result="edgeB"></feGaussianBlur>
        <feFlood flood-color="#8EEBFF" flood-opacity="0.8" result="col"></feFlood>
        <feComposite in="col" in2="edgeB" operator="in" result="rim"></feComposite>
        <feComposite in="rim" in2="SourceAlpha" operator="in" result="rimIn"></feComposite>
        <feMerge><feMergeNode in="SourceGraphic"></feMergeNode><feMergeNode in="rimIn"></feMergeNode></feMerge>
      </filter>

      <!-- footwear, placed under or over the bottoms -->
      <g id="{{uid}}Shoes">
        <sc-if value="{{sSneakers}}" hint-placeholder-val="{{true}}">
          <path d="M87 266 L102 266 L103 282 L80 282 C77 282 76 279 78 277 C82 274 86 272 87 266 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M113 266 L127 266 C129 271 134 273 138 276 C140 278 139 281 136 281 L112 281 C111 276 112 270 113 266 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M77 281 L103.5 281 L103.5 285 L78 285 C76.5 285 76 283 77 281 Z M111.5 280 L137 280 C138.5 281 138 284 136.5 284 L112 284 Z" fill="{{sole}}"></path>
          <path d="M83 277 L98 273 M117 274 L132 277.5" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round"></path>
          <path d="M90 270 L99 269 M115 270 L124 270.5" stroke="{{shoeD}}" stroke-width="0.8" stroke-dasharray="1 1"></path>
        </sc-if>
        <sc-if value="{{sHigh}}" hint-placeholder-val="{{false}}">
          <path d="M87 250 L102 250 L103 282 L80 282 C77 282 76 279 78 277 C82 274 86 270 87 250 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M113 250 L127 250 C128 266 133 272 138 276 C140 278 139 281 136 281 L112 281 C111 270 112 260 113 250 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M77 281 L103.5 281 L103.5 285 L78 285 C76.5 285 76 283 77 281 Z M111.5 280 L137 280 C138.5 281 138 284 136.5 284 L112 284 Z" fill="{{sole}}"></path>
          <path d="M91 254 L99 256 M91 258 L99 260 M91 262 L99 264 M91 266 L99 268 M116 254 L124 256 M116 258 L124 260 M116 262 L124 264 M117 266 L125 268" stroke="{{sole}}" stroke-width="0.9"></path>
          <circle cx="89" cy="262" r="2.6" fill="{{accent}}"></circle><circle cx="126" cy="262" r="2.6" fill="{{accent}}"></circle>
        </sc-if>
        <sc-if value="{{sBoots}}" hint-placeholder-val="{{false}}">
          <path d="M87 246 L102 246 L102.5 280 L86 280 L85 285 L81 285 L81 280 C77 280 76 278 78 276 C82 273 86 266 87 246 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M113 246 L127 246 C128 264 133 271 137 274 C139 276 139 279 136 279 L118 279 L117 284 L113 284 C112 270 112 258 113 246 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M87.5 250 L101.5 250 M113.5 250 L126.5 250" stroke="{{shoeD}}" stroke-width="1.4"></path>
          <path d="M100 252 L100 276 M125 252 L126 272" stroke="{{shoeL}}" stroke-width="0.6" stroke-dasharray="1.2 1"></path>
        </sc-if>
        <sc-if value="{{sHeels}}" hint-placeholder-val="{{false}}">
          <path d="M84 272 C88 270 96 270 101.5 272 L102 281 L81 281 C79 281 78.5 278 81 277 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M100 280 L102.4 280 L102.2 287 L100.8 287 Z" fill="{{shoeD}}"></path>
          <path d="M116 272 C120 271 126 271 128 272 C130 274 134 275 136 277 C137 279 136 280 134 280 L114 280 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M114.5 279 L116.6 279 L116 286 L114.8 286 Z" fill="{{shoeD}}"></path>
        </sc-if>
        <sc-if value="{{sLoafers}}" hint-placeholder-val="{{false}}">
          <path d="M86 270 L102 270 L102.5 282 L80 282 C77 282 76 279 78 277 C81 275 84 273 86 270 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M113 270 L127 270 C129 273 134 275 137 277 C139 279 138 281 135 281 L112 281 C112 277 112.5 273 113 270 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M84 275 L96 273 M117 274 L130 276" stroke="{{shoeD}}" stroke-width="1.6"></path>
          <path d="M78 282 L102.5 282 L102.5 284.5 L78 284.5 Z M112 281 L136 281 L136 283.5 L112 283.5 Z" fill="{{shoeD}}"></path>
        </sc-if>
        <sc-if value="{{sSandals}}" hint-placeholder-val="{{false}}">
          <path d="M78 281 L103 281 L103 284 L78 284 Z M112 280 L137 280 L137 283 L112 283 Z" fill="{{shoeD}}"></path>
          <path d="M82 278 L100 274 M86 273 L100 270 M116 273 L133 277 M118 270 L127 270" stroke="url(#{{uid}}Shoe)" stroke-width="2.2" stroke-linecap="round"></path>
        </sc-if>
        <sc-if value="{{sFlats}}" hint-placeholder-val="{{false}}">
          <path d="M86 271 L102 271 L102.5 282 L79 282 C75 282 74 279 76 278 C80 276 84 274 86 271 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M113 271 L127 271 C129 274 134 276 139 277 C141 279 139 281 136 281 L112 281 C112 277 112.5 274 113 271 Z" fill="url(#{{uid}}Shoe)"></path>
          <path d="M82 278 C86 276 90 275 94 275 M118 275 C122 275 127 276 132 278" stroke="url(#{{uid}}Gold)" stroke-width="1.2" stroke-dasharray="1 1"></path>
          <circle cx="86" cy="277" r="1" fill="url(#{{uid}}Gold)"></circle><circle cx="128" cy="277" r="1" fill="url(#{{uid}}Gold)"></circle>
        </sc-if>
      </g>
    </defs>

    <ellipse class="av-shadow" cx="106" cy="286" rx="46" ry="7" fill="rgba(0,0,0,0.42)"></ellipse>

    <g class="av-body">
      <g filter="{{rimFilter}}">
        <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
          <ellipse cx="91" cy="283" rx="14" ry="2.6" fill="#000000" opacity="0.55" filter="url(#{{uid}}B2)"></ellipse>
          <ellipse cx="125" cy="282" rx="13" ry="2.4" fill="#000000" opacity="0.45" filter="url(#{{uid}}B2)"></ellipse>
        </sc-if>

        <!-- ============ LOWER BODY ============ -->
        <path d="M78 146 C77 168 80 190 85 210 C87 230 88 250 89 268 L100 268 C100 250 100 230 100 210 C101 190 101 168 100 148 Z" fill="url(#{{uid}}Skin)"></path>
        <path d="M101 150 C100 172 100 194 101 212 C105 232 111 250 114 268 L126 268 C125 250 120 230 117 212 C120 192 124 170 123 150 Z" fill="url(#{{uid}}Skin)"></path>
        <path d="M84 206 C88 208 93 208 97 206 M104 208 C108 211 112 211 116 209" stroke="{{skinD}}" stroke-width="0.8" fill="none" opacity="0.6"></path>
        <path d="M89 266 L100 266 L101 280 L82 280 C80 280 79 278 81 276 C84 273 87 271 89 266 Z" fill="url(#{{uid}}Skin)"></path>
        <path d="M114 266 L126 266 C128 271 132 273 136 275 C138 277 137 279 135 279 L113 279 C112 275 113 270 114 266 Z" fill="url(#{{uid}}Skin)"></path>
        <path d="M77 132 L123 138 L124 152 L76 147 Z" fill="url(#{{uid}}Skin)"></path>

        <sc-if value="{{shoesUnder}}" hint-placeholder-val="{{false}}"><use href="#{{uid}}Shoes"></use></sc-if>

        <!-- trousers: joggers / cargo / jeans -->
        <sc-if value="{{bPants}}" hint-placeholder-val="{{true}}">
          <path d="M76 144 C75 168 79 190 84 210 C86 230 87 250 88 268 L101 268 C101 250 101 230 101 210 C102 190 102 168 101 148 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M101 150 C100 172 99 194 100 212 C104 232 110 250 113 268 L127 268 C126 250 121 230 118 212 C121 192 126 170 125 150 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M77 130 L123 136 L126 153 L74 147 Z" fill="url(#{{uid}}Bot)"></path>
          <sc-if value="{{botDenim}}" hint-placeholder-val="{{false}}">
            <path d="M76 144 C75 168 79 190 84 210 C86 230 87 250 88 268 L101 268 C101 250 101 230 101 210 C102 190 102 168 101 148 Z M101 150 C100 172 99 194 100 212 C104 232 110 250 113 268 L127 268 C126 250 121 230 118 212 C121 192 126 170 125 150 Z M77 130 L123 136 L126 153 L74 147 Z" fill="url(#{{uid}}Twill)"></path>
            <path d="M78 144 C82 150 88 152 92 150 M122 150 C118 155 112 157 108 155" stroke="{{botL}}" stroke-width="0.7" stroke-dasharray="1.2 1" fill="none"></path>
          </sc-if>
          <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
            <path d="M97 152 L103 152 L101.5 206 L99 206 Z" fill="#0A0A14" opacity="0.5" filter="url(#{{uid}}B2)"></path>
            <path d="M80 160 C80 180 82 196 86 206" stroke="#FFFFFF" stroke-width="3" opacity="0.13" fill="none" filter="url(#{{uid}}B2)"></path>
          </sc-if>
          <path d="M85 205 C89 207.5 94 207.5 98.5 205.5 M86 212 C89.5 213.5 93.5 213.5 97 212 M101 206 C106 210 112 211 118 208 M102.5 215 C107 218 112 218 116.5 215.5" stroke="{{botD}}" stroke-width="1" fill="none"></path>
          <path d="M78.5 158 C80 182 83 206 86.5 238 M123 160 C121 184 118.5 206 120 236" stroke="{{botL}}" stroke-width="0.6" stroke-dasharray="1.6 1.4" fill="none" opacity="0.7"></path>
          <sc-if value="{{bJoggers}}" hint-placeholder-val="{{true}}">
            <path d="M87 259 L101.5 259 L101.5 268 L88 268 Z M112 259 L126.5 259 L127.5 268 L113.5 268 Z" fill="{{botD}}"></path>
          </sc-if>
          <sc-if value="{{bCargo}}" hint-placeholder-val="{{false}}">
            <path d="M76.5 176 L85 176 L86 196 L78.5 196 Z M118 178 L126 178 L124.5 198 L117 198 Z" fill="{{botD}}" opacity="0.85"></path>
            <path d="M76.5 180 L85.2 180 M118 182 L126 182" stroke="{{botL}}" stroke-width="0.6"></path>
            <path d="M87 259 L101.5 259 L101.5 268 L88 268 Z M112 259 L126.5 259 L127.5 268 L113.5 268 Z" fill="{{botD}}"></path>
          </sc-if>
          <sc-if value="{{bJeans}}" hint-placeholder-val="{{false}}">
            <path d="M88 262 L101 262 M113 262 L127 262" stroke="{{botL}}" stroke-width="1.2"></path>
          </sc-if>
        </sc-if>

        <sc-if value="{{bLeggings}}" hint-placeholder-val="{{false}}">
          <path d="M78 146 C77 168 80 190 85 210 C87 230 88 250 89 268 L100 268 C100 250 100 230 100 210 C101 190 101 168 100 148 Z M101 150 C100 172 100 194 101 212 C105 232 111 250 114 268 L126 268 C125 250 120 230 117 212 C120 192 124 170 123 150 Z M77 132 L123 138 L124 152 L76 147 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M77 132 L123 138 L123.3 142 L76.8 136.5 Z" fill="{{botD}}"></path>
          <path d="M80 158 C81 180 84 200 88 230" stroke="#FFFFFF" stroke-width="2.6" opacity="0.14" fill="none"></path>
        </sc-if>

        <sc-if value="{{bWide}}" hint-placeholder-val="{{false}}">
          <path d="M75 144 C73 170 74 200 76 230 C77 250 77 262 77 279 L101 279 C101 260 101 240 101 212 C101 190 101 168 101 148 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M101 150 C101 172 101 194 102 214 C104 240 106 262 107 279 L133 279 C132 260 129 236 126 212 C126 190 126 170 125 150 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M77 130 L123 136 L126 153 L74 147 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M88 150 C88 190 89 230 89 278 M114 156 C115 196 118 236 120 278" stroke="{{botD}}" stroke-width="1" fill="none" opacity="0.8"></path>
          <path d="M86 150 C86 190 87 230 87 278" stroke="{{botL}}" stroke-width="0.8" fill="none" opacity="0.5"></path>
          <path d="M101 160 L101 279" stroke="#0A0A14" stroke-width="2" opacity="0.3"></path>
        </sc-if>

        <sc-if value="{{bShorts}}" hint-placeholder-val="{{false}}">
          <path d="M76 132 L124 138 L126 176 C120 178 110 178 103 174 L101 162 L99 172 C92 176 82 176 75 174 Z" fill="url(#{{uid}}Bot)"></path>
          <sc-if value="{{botDenim}}" hint-placeholder-val="{{false}}">
            <path d="M76 132 L124 138 L126 176 C120 178 110 178 103 174 L101 162 L99 172 C92 176 82 176 75 174 Z" fill="url(#{{uid}}Twill)"></path>
            <path d="M75.5 172 l1 3 l1.2 -2.6 l1 3 l1.2 -2.8 l1 3 l1.2 -2.6 l1 3 l1.2 -2.6 l1 3 l1.2 -2.6 l1 3 M104 172.5 l1 3 l1.2 -2.6 l1 3 l1.2 -2.8 l1 3 l1.2 -2.6 l1 3 l1.2 -2.6 l1 3 l1.2 -2.6 l1 3" stroke="{{botL}}" stroke-width="0.7" fill="none"></path>
          </sc-if>
          <path d="M79 146 C84 152 90 153 94 150 M121 152 C116 157 110 158 106 156" stroke="{{botD}}" stroke-width="0.8" fill="none"></path>
          <path d="M101 145 L101 162" stroke="{{botD}}" stroke-width="0.9"></path>
        </sc-if>

        <sc-if value="{{bPleated}}" hint-placeholder-val="{{false}}">
          <path d="M77 132 L123 138 L135 184 C112 190 88 190 66 182 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M82 136 L76 184 M88 137 L85 187 M94 137.5 L94 188 M100 138 L102 188.5 M106 139 L110 188 M112 139.5 L118 187 M118 140 L126 185" stroke="{{botD}}" stroke-width="0.9"></path>
          <path d="M85 137 L80 185 M97 138 L98 188 M109 139 L114 188" stroke="{{botL}}" stroke-width="0.6" opacity="0.7"></path>
        </sc-if>

        <sc-if value="{{bMidi}}" hint-placeholder-val="{{false}}">
          <path d="M77 132 L123 138 C128 170 134 205 138 236 C114 242 86 242 62 234 C66 205 72 170 77 132 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M86 150 C82 180 78 210 74 236 M100 152 C100 184 100 214 100 240 M112 152 C116 184 120 214 124 238" stroke="{{botD}}" stroke-width="1" fill="none" opacity="0.7"></path>
          <path d="M92 152 C90 184 88 214 86 240" stroke="{{botL}}" stroke-width="1.2" fill="none" opacity="0.4"></path>
        </sc-if>

        <sc-if value="{{bPencil}}" hint-placeholder-val="{{false}}">
          <path d="M77 132 L123 138 C125 160 124 185 121 212 C108 215 92 215 79 212 C76 185 75 160 77 132 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M100 196 L100 213" stroke="{{botD}}" stroke-width="0.9"></path>
          <path d="M84 160 C86 176 87 192 87 208" stroke="#FFFFFF" stroke-width="2.4" opacity="0.13" fill="none"></path>
        </sc-if>

        <sc-if value="{{bAline}}" hint-placeholder-val="{{false}}">
          <path d="M77 132 L123 138 C127 160 131 185 134 208 C112 214 88 214 66 206 C70 185 73 160 77 132 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M88 150 C84 170 80 190 77 210 M112 152 C116 172 120 192 123 212" stroke="{{botD}}" stroke-width="0.9" fill="none" opacity="0.8"></path>
        </sc-if>

        <!-- saree skirt (Nivi, Kanjivaram, Party drapes) -->
        <sc-if value="{{skirtSaree}}" hint-placeholder-val="{{false}}">
          <sc-if value="{{party}}" hint-placeholder-val="{{false}}">
            <path d="M80 130 L120 135 C122 170 124 220 125 276 L79 276 C78 220 78 170 80 130 Z" fill="{{botD}}"></path>
          </sc-if>
          <g opacity="{{sheerSkirt}}">
            <path d="M76 128 L124 134 C127 170 130 220 132 278 L72 278 C72 220 73 170 76 128 Z" fill="url(#{{uid}}Bot)"></path>
            <sc-if value="{{kanji}}" hint-placeholder-val="{{false}}">
              <path d="M76 128 L124 134 C127 170 130 220 132 278 L72 278 C72 220 73 170 76 128 Z" fill="url(#{{uid}}Butta)"></path>
            </sc-if>
            <sc-if value="{{party}}" hint-placeholder-val="{{false}}">
              <path d="M76 128 L124 134 C127 170 130 220 132 278 L72 278 C72 220 73 170 76 128 Z" fill="url(#{{uid}}Seq)"></path>
            </sc-if>
            <path d="M98 144 L90 278 M100 144 L95 278 M102 144 L100 278 M104 144 L105 278 M106 144 L110 278" stroke="{{botD}}" stroke-width="0.9"></path>
            <path d="M99 144 L92.5 278 M103 144 L102.5 278 M105 144 L107.5 278" stroke="{{botL}}" stroke-width="0.7" opacity="0.7"></path>
          </g>
          <sc-if value="{{kanji}}" hint-placeholder-val="{{false}}">
            <path d="M72 250 L132 250 L132 278 L72 278 Z" fill="url(#{{uid}}Gold)"></path>
            <path d="M72 257 L132 257 L132 263 L72 263 Z" fill="{{botD}}"></path>
            <path d="M72 250 L75 244 L78 250 L81 244 L84 250 L87 244 L90 250 L93 244 L96 250 L99 244 L102 250 L105 244 L108 250 L111 244 L114 250 L117 244 L120 250 L123 244 L126 250 L129 244 L132 250 Z" fill="url(#{{uid}}Gold)"></path>
            <path d="M74 260 L132 260" stroke="url(#{{uid}}Gold)" stroke-width="1.2" stroke-dasharray="1.2 2"></path>
            <path d="M72 269 L132 269 M72 274 L132 274" stroke="#A87A1C" stroke-width="0.6" stroke-dasharray="1.5 1"></path>
          </sc-if>
          <sc-if value="{{party}}" hint-placeholder-val="{{false}}">
            <path d="M72 272 L132 272 L132 278 L72 278 Z" fill="{{accent}}" opacity="0.95"></path>
            <path d="M72 270 L132 270" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="0.8 1.6" opacity="0.9"></path>
          </sc-if>
          <sc-if value="{{niviBorder}}" hint-placeholder-val="{{true}}">
            <path d="M72 268 L132 268 L132 278 L72 278 Z" fill="{{accent}}"></path>
            <path d="M72 270.5 L132 270.5 M72 275.5 L132 275.5" stroke="{{botD}}" stroke-width="0.6" stroke-dasharray="1.5 1"></path>
          </sc-if>
          <path d="M76 128 L124 134 L124 137 L76 131 Z" fill="{{botD}}"></path>
        </sc-if>

        <!-- Nauvari: nine-yard drape worn dhoti-style -->
        <sc-if value="{{bNauvari}}" hint-placeholder-val="{{false}}">
          <path d="M76 130 L101 136 L100 210 C99 226 98 238 97 249 L84 249 C82 236 80 220 78 200 C76 176 75 152 76 130 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M101 138 L125 140 C126 165 124 190 119 210 C118 226 119 238 121 249 L108 249 C106 238 103 224 101 210 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M78 150 C84 160 92 166 100 168 M79 176 C85 186 92 192 99 194 M81 204 C86 212 92 218 98 220 M124 152 C118 162 110 168 102 170 M122 180 C116 190 109 196 102 198 M119 210 C114 218 109 224 104 226" stroke="{{botD}}" stroke-width="1" fill="none"></path>
          <path d="M80 160 C86 170 93 174 100 176 M123 162 C117 172 110 176 102 178" stroke="{{botL}}" stroke-width="0.8" fill="none" opacity="0.6"></path>
          <path d="M84 243 L97.3 243 L97 249 L84 249 Z M108 243 L120.7 243 L121 249 L108 249 Z" fill="{{accent}}"></path>
          <path d="M94 136 L106 138 L108 236 L96 238 Z" fill="url(#{{uid}}Bot)"></path>
          <path d="M98 138 L99 237 M101 138 L102 237 M104 138 L105.5 236.5" stroke="{{botD}}" stroke-width="0.8"></path>
          <path d="M95.6 231 L107.7 229 L108 236 L96 238 Z" fill="{{accent}}"></path>
          <path d="M76 130 L124 136 L124 141 L76 135 Z" fill="url(#{{uid}}Gold)"></path>
          <path d="M77 132.5 L123 138.5" stroke="#A87A1C" stroke-width="0.5" stroke-dasharray="1.2 1"></path>
        </sc-if>

        <sc-if value="{{belt}}" hint-placeholder-val="{{true}}">
          <path d="M76 132 L124 138 L124 144 L76 138 Z" fill="{{beltC}}"></path>
          <path d="M77 134.5 L123 140.5" stroke="{{beltL}}" stroke-width="0.5" stroke-dasharray="1.2 1"></path>
          <rect x="96" y="133.2" width="8" height="8" rx="1" fill="url(#{{uid}}Gold)" transform="rotate(7 100 137)"></rect>
          <rect x="97.6" y="134.8" width="4.8" height="4.8" rx="0.6" fill="{{beltC}}" transform="rotate(7 100 137)"></rect>
        </sc-if>
        <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
          <path d="M76 141 L124 147" stroke="#0A0A14" stroke-width="3" opacity="0.35" filter="url(#{{uid}}B2)"></path>
        </sc-if>

        <sc-if value="{{shoesOver}}" hint-placeholder-val="{{true}}"><use href="#{{uid}}Shoes"></use></sc-if>

        <!-- ============ UPPER BODY ============ -->
        <g transform="rotate(-3 100 138)">

          <!-- hair that falls behind the body -->
          <sc-if value="{{hBraid}}" hint-placeholder-val="{{true}}">
