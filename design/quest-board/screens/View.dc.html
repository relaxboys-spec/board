<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Viewing a Note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;family=Barlow:wght@500;600;700&amp;family=Caveat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070E26}
a{color:#FFE14D}a:hover{color:#FFF0A0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 1194px; height: 834px; position: relative; overflow: hidden; font-family: 'Barlow', sans-serif; color: #FFFFFF; background: #070E26">

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; filter: blur(6px) saturate(0.8)">
    <dc-import name="Main" hint-size="1194px,834px"></dc-import>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(4,9,28,0.74)"></div>

  <div role="dialog" aria-label="Note" style="position: absolute; left: 60px; top: 48px; width: 1074px; height: 738px; display: flex; gap: 22px">

    <!-- the note -->
    <div style="position: relative; flex: none; width: 680px; height: 100%; box-sizing: border-box; padding: 5px; background: linear-gradient(160deg, #D06BFF 0%, #5E1FC0 100%); clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 0 100%); box-shadow: 0 24px 60px rgba(0,0,0,0.5)">
      <div style="position: relative; width: 100%; height: 100%; box-sizing: border-box; padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 18px; background-color: #0C1840; background-image: radial-gradient(rgba(255,255,255,0.09) 1.2px, rgba(255,255,255,0) 1.8px); background-size: 24px 24px; clip-path: polygon(0 0, calc(100% - 27px) 0, 100% 27px, 100% 100%, 0 100%)">

        <div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="padding: 4px 12px; background: linear-gradient(160deg, #D06BFF 0%, #5E1FC0 100%); color: #FFFFFF; font-weight: 900; font-style: italic; font-size: 16px; letter-spacing: 0.1em; transform: skewX(-12deg)">High</span>
            <span style="font-size: 15px; letter-spacing: 0.12em; color: #DDA0FF">Work · Due Fri</span>
          </div>
          <span style="font-style: italic; font-size: 24px; color: #FFE14D">+100 XP</span>
        </div>

        <!-- photo -->
        <div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center">
          <button type="button" aria-label="View photo full screen" style="position: relative; padding: 12px 12px 14px; border: none; cursor: zoom-in; background: #F2F6FF; transform: rotate(-2deg); box-shadow: 0 18px 38px rgba(0,0,0,0.55)">
            <span style="position: absolute; top: -13px; left: 50%; width: 100px; height: 26px; margin-left: -50px; background: rgba(255,225,77,0.78); transform: rotate(2deg)"></span>
            <span style="width: 520px; height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background-color: #22305C; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 10px, rgba(255,255,255,0) 10px, rgba(255,255,255,0) 20px); color: #B9C8EA">
              <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#B9C8EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
              <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase">[Receipt photo]</span>
            </span>
            <span style="position: absolute; right: 22px; bottom: 26px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(4,10,30,0.8)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
            </span>
          </button>
        </div>

        <!-- handwriting -->
        <div style="display: flex; justify-content: center; padding: 0 10px">
          <span style="font-family: 'Caveat', cursive; font-weight: 600; font-size: 64px; line-height: 1; color: #F2F6FF; text-align: center; transform: rotate(-2deg)">Get this receipt reimbursed</span>
        </div>

        <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; inset: 0; background: rgba(4,10,30,0.55); display: flex; align-items: center; justify-content: center">
            <span style="display: flex; align-items: center; gap: 10px; padding: 12px 26px; background: #FFE14D; color: #0A1430; transform: rotate(-8deg); font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-style: italic; font-size: 44px; letter-spacing: 0.06em; text-transform: uppercase; box-shadow: 0 10px 24px rgba(0,0,0,0.45)">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0A1430" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
              Complete
            </span>
          </div>
        </sc-if>
      </div>
    </div>

    <!-- details rail -->
    <div style="flex: 1; min-width: 0; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 18px; background: rgba(8,18,52,0.92); border: 1px solid rgba(120,170,255,0.25); clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 0 100%)">

      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 15px; letter-spacing: 0.14em; color: #3BE0FF; text-transform: uppercase">Weekly Challenge</span>
          <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-style: italic; font-size: 40px; line-height: 0.95; text-transform: uppercase">Note Info</h2>
        </div>
        <a href="Main.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); transform: skewX(-12deg)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="transform: skewX(12deg)"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </a>
      </div>

      <div style="display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.1)">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.1)">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.12em; color: #B9C8EA; text-transform: uppercase">Status</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; text-transform: uppercase; color: {{statusColor}}">{{statusText}}</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.1)">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.12em; color: #B9C8EA; text-transform: uppercase">Due</span>
          <span style="font-size: 17px; font-weight: 600">Fri, Oct 9</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.1)">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.12em; color: #B9C8EA; text-transform: uppercase">Created</span>
          <span style="font-size: 17px; font-weight: 600">Mon, Oct 5 · 9:14 AM</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.1)">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.12em; color: #B9C8EA; text-transform: uppercase">Board</span>
          <span style="font-size: 17px; font-weight: 600">Work</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.1)">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.12em; color: #B9C8EA; text-transform: uppercase">Attached</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DCE6FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
            1 photo
          </span>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <a href="Write.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #DCE6FF; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DCE6FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg>
          Edit
        </a>
        <button type="button" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: #DCE6FF; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DCE6FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Move to Today
        </button>
        <button type="button" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: #FF9AAE; border: 1px solid rgba(255,77,109,0.35); background: rgba(255,77,109,0.07); font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF9AAE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
          Delete
        </button>
      </div>

      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
        <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{complete}}" style="height: 64px; border: none; cursor: pointer; background: #FFE14D; color: #0A1430; transform: skewX(-8deg); box-shadow: 0 6px 0 #B89A12; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-style: italic; font-size: 28px; letter-spacing: 0.04em; text-transform: uppercase">
            <span style="display: flex; align-items: center; justify-content: center; gap: 10px; transform: skewX(8deg)">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A1430" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
              Complete · +100 XP
            </span>
          </button>
        </sc-if>
        <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: rgba(255,225,77,0.1); border: 1px solid rgba(255,225,77,0.4)">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.12em; color: #FFE9A0; text-transform: uppercase">Sent to Vault</span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-style: italic; font-size: 30px; line-height: 1; color: #FFE14D">+100 XP</span>
          </div>
          <button type="button" onClick="{{reopen}}" style="height: 52px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: #DCE6FF; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase">Undo complete</button>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var done = !!(this.state && this.state.done);
    return {
      done: done,
      notDone: !done,
      statusText: done ? 'Complete' : 'Active',
      statusColor: done ? '#FFE14D' : '#7CF59A',
      complete: function () { self.setState({ done: true }); },
      reopen: function () { self.setState({ done: false }); }
    };
  }
}
</script>
</body>
</html>
